name: Edge0Demo
options:
  bundleIdPrefix: com.bahacan16.edge0demo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Edge0 Demo"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

packages:
  MLXSwift:
    # NOTE: mlx-swift >= 0.31.5 declares swift-tools-version 6.3, which the
    # runner's Xcode 26.3 SwiftPM refuses. A range lets SPM fall back to the
    # newest tools-compatible release (0.31.4) instead of failing outright.
    url: https://github.com/ml-explore/mlx-swift
    minVersion: 0.31.0
    maxVersion: 0.32.0
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

targets:
  Edge0Demo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Edge0Demo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bahacan16.edge0demo
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - package: MLXSwift
        product: MLXFast
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    scheme:
      testTargets: []
      gatherCoverageData: false
