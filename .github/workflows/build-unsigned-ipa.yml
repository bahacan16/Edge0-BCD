name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - claude/iphone-17-pro-max-unsigned-ipa-iu163d
    paths:
      - "ios/**"
      - ".github/workflows/build-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      # 168 MB and four wheels; cached so only the first build after a
      # version bump pays for it.
      - name: Cache Python runtime
        id: python-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Python.xcframework
            ios/Resources/app_packages
          key: edge0-python-3.14-ezdxf103-pypdf-v4

      - name: Fetch Python runtime and packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ios/Tools/fetch-python.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # MLX's C++/Metal sources take ~12 minutes to compile from scratch, which
      # dominates every run. Restoring DerivedData lets xcodebuild reuse those
      # object files and only rebuild the app's own Swift sources.
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: ios/build
          key: edge0-derived-${{ hashFiles('ios/project.yml') }}-${{ github.sha }}
          restore-keys: |
            edge0-derived-${{ hashFiles('ios/project.yml') }}-
            edge0-derived-

      - name: Resolve Swift package dependencies
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Edge0Demo.xcodeproj \
            -scheme Edge0Demo \
            -derivedDataPath build

      # The build number is the run number and the commit is stamped into the
      # bundle. Every build so far has called itself "1.0 (1)", so a log from
      # the device could not say which one produced it, and working that out
      # from behaviour cost this project two misdiagnoses. It also matters for
      # installing: a build number that only ever goes up is what lets a new
      # IPA replace the old app in place, keeping its Documents folder — and
      # its checkpoint — instead of being reinstalled from scratch.
      - name: Build unsigned .app for iOS device
        working-directory: ios
        run: |
          xcodebuild build \
            -project Edge0Demo.xcodeproj \
            -scheme Edge0Demo \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -skipMacroValidation \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # Saved even on failure: a failed Swift compile still leaves MLX's object
      # files behind, which is exactly what the next iteration wants to reuse.
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ios/build
          key: edge0-derived-${{ hashFiles('ios/project.yml') }}-${{ github.sha }}

      # Written into the built bundle rather than passed as a build setting:
      # `INFOPLIST_KEY_*` only carries the keys Xcode knows about, so
      # `Edge0Commit` was silently dropped and the log line that was supposed to
      # name the commit came back without one.
      - name: Stamp the commit into the app
        working-directory: ios
        run: |
          set -euo pipefail
          PLIST="build/Build/Products/Release-iphoneos/Edge0Demo.app/Info.plist"
          SHA=$(git rev-parse --short HEAD)
          /usr/libexec/PlistBuddy -c "Add :Edge0Commit string $SHA" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :Edge0Commit $SHA" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :Edge0Commit" "$PLIST"

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Edge0Demo.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            find build/Build/Products -maxdepth 3 || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y Edge0Demo-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Edge0Demo-unsigned-ipa
          path: ios/Edge0Demo-unsigned.ipa
          retention-days: 14

      # Runs even when the build fails: a Swift compile error aborts before
      # any post-build phase, and the fetch step's output is unreachable at
      # the top of a log that can only be read from the end.
      # Short on purpose, and last. The module map dump that used to live here
      # is two hundred `exclude header` lines, which pushed the one thing worth
      # reading out of the window a job log comes back in. Its question is
      # answered; this one's is not.
      - name: Report Python packaging
        if: always()
        run: |
          set +e
          cat ios/python-install-report.txt 2>/dev/null || echo "(no report written)"
          exit 0
