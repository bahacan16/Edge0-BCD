name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - claude/iphone-17-pro-max-unsigned-ipa-iu163d
    paths:
      - "ios/**"
      - ".github/workflows/build-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Edge0Demo.xcodeproj \
            -scheme Edge0Demo

      - name: Build unsigned .app for iOS device
        working-directory: ios
        run: |
          xcodebuild build \
            -project Edge0Demo.xcodeproj \
            -scheme Edge0Demo \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Edge0Demo.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            find build/Build/Products -maxdepth 3 || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y Edge0Demo-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Edge0Demo-unsigned-ipa
          path: ios/Edge0Demo-unsigned.ipa
          retention-days: 14
